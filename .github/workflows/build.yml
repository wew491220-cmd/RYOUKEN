name: Flutter APK Auto Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing the Flutter ZIP
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  MIN_GRADLE: "8.14"
  MIN_AGP: "8.11.1"
  MIN_KOTLIN: "2.2.20"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Flutter project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p input project
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir input
          ZIP="$(find input -maxdepth 1 -type f -name '*.zip' | head -n1)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d project
          dirs=(project/*)
          if [ "${#dirs[@]}" -eq 1 ] && [ -d "${dirs[0]}" ] && [ -f "${dirs[0]}/pubspec.yaml" ]; then
            mv "${dirs[0]}" project_root
          else
            mv project project_root
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Auto fix Android build tool versions
        working-directory: project_root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          MIN_GRADLE=(8,14)
          MIN_AGP=(8,11,1)
          MIN_KOTLIN=(2,2,20)

          def ver(s):
              m=re.match(r'^(\d+(?:\.\d+){0,3})', s)
              return tuple(map(int,m.group(1).split('.'))) if m else (0,)

          # Gradle wrapper: do not depend on the old URL regex. If a wrapper exists,
          # normalize it to a known-valid Gradle 8.14 distribution when necessary.
          wrappers=list(Path('.').glob('**/gradle/wrapper/gradle-wrapper.properties'))
          for p in wrappers:
              text=p.read_text(errors='ignore')
              m=re.search(r'gradle-(\d+(?:\.\d+)+)-(?:all|bin)\.zip', text)
              current=ver(m.group(1)) if m else (0,)
              if current < MIN_GRADLE:
                  text2=re.sub(r'gradle-\d+(?:\.\d+)+-(?:all|bin)\.zip', 'gradle-8.14-all.zip', text)
                  if text2 == text:
                      text2=re.sub(r'(?m)^\s*distributionUrl\s*=.*$', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip', text)
                  if text2 == text:
                      # Some projects have unusual wrapper formatting; replace the entire property.
                      if re.search(r'(?m)^\s*distributionUrl\s*=', text):
                          text2=re.sub(r'(?m)^\s*distributionUrl\s*=.*$', 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip', text)
                      else:
                          text2=text.rstrip()+"\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip\n"
                  p.write_text(text2)
                  print(f'PATCHED GRADLE {p}: {current} -> 8.14')
              else:
                  print(f'GRADLE OK {p}: {current}')

          files=[]
          for pat in ('**/settings.gradle','**/settings.gradle.kts','**/build.gradle','**/build.gradle.kts'):
              files.extend(Path('.').glob(pat))
          seen=set()
          for p in files:
              if p in seen: continue
              seen.add(p)
              text=p.read_text(errors='ignore')
              original=text

              # AGP plugins DSL
              def agp_plugin(m):
                  old=ver(m.group(2))
                  return m.group(1)+('8.11.1' if old < MIN_AGP else m.group(2))+m.group(3)
              text=re.sub(r"(id\s*\(?\s*['"]com\.android\.(?:application|library)['"]\s*\)?\s*version\s*['"])(\d+(?:\.\d+)+)(['"])", agp_plugin, text)

              # AGP legacy classpath
              def agp_cp(m):
                  old=ver(m.group(2))
                  return m.group(1)+('8.11.1' if old < MIN_AGP else m.group(2))+m.group(3)
              text=re.sub(r"(com\.android\.tools\.build:gradle:)(\d+(?:\.\d+)+)(\b)", agp_cp, text)

              # Kotlin Android plugin in plugins DSL.
              def kotlin_plugin(m):
                  old=ver(m.group(2))
                  return m.group(1)+('2.2.20' if old < MIN_KOTLIN else m.group(2))+m.group(3)
              text=re.sub(r"(id\s*\(?\s*['"]org\.jetbrains\.kotlin\.(?:android|jvm)['"]\s*\)?\s*version\s*['"])(\d+(?:\.\d+)+)(['"])", kotlin_plugin, text)

              # Kotlin legacy classpath.
              def kotlin_cp(m):
                  old=ver(m.group(2))
                  return m.group(1)+('2.2.20' if old < MIN_KOTLIN else m.group(2))+m.group(3)
              text=re.sub(r"(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)(\d+(?:\.\d+)+)(\b)", kotlin_cp, text)

              # Common ext/variable declarations, e.g. kotlin_version = '2.1.0'.
              def kotlin_var(m):
                  old=ver(m.group(3))
                  return m.group(1)+m.group(2)+('2.2.20' if old < MIN_KOTLIN else m.group(3))+m.group(4)
              text=re.sub(r"((?:ext\.|def\s+|val\s+)?(?:kotlin[_-]?version)\s*[=:]\s*['"])(\d+(?:\.\d+)+)(['"])", lambda m: m.group(0) if ver(m.group(2)) >= MIN_KOTLIN else m.group(1)+'2.2.20'+m.group(3), text, flags=re.I)

              if text != original:
                  p.write_text(text)
                  print(f'PATCHED ANDROID TOOLS {p}')

          print('ANDROID COMPATIBILITY AUTO-FIX COMPLETE: Gradle >= 8.14, AGP >= 8.11.1, Kotlin >= 2.2.20')
          PY

      - name: Show Android tool versions
        working-directory: project_root
        run: |
          echo '--- Gradle wrapper ---'
          grep -R "distributionUrl=" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          echo '--- AGP + Kotlin references ---'
          grep -RInE 'com\.android\.(application|library).*version|com\.android\.tools\.build:gradle:|org\.jetbrains\.kotlin.*version|kotlin-gradle-plugin:' android --include='*.gradle' --include='*.gradle.kts' 2>/dev/null || true
          echo '--- Flutter ---'
          flutter --version

      - name: Flutter pub get
        working-directory: project_root
        run: flutter pub get

      - name: Build APK
        working-directory: project_root
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: project_root/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7
